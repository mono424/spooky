[package]
name = "job-runner"
version = "0.0.1-canary.88"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
surrealdb = { version = "3.1.2", features = ["protocol-ws"] }
tracing = "0.1"
anyhow = "1"
