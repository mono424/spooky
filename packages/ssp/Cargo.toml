[package]
name = "ssp"
version = "0.0.1-canary.69"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["parallel", "mimalloc"]
parallel = ["dep:rayon"]
# mimalloc as the global allocator (native, non-wasm). Kept on by default for
# the server/CLI, but disabled by the Dart FFI build: mimalloc's per-thread
# init/teardown segfaults inside a dylib loaded into the Dart VM's multi-isolate
# process. See packages/ssp-ffi.
mimalloc = ["dep:mimalloc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "1.2"
anyhow = "1.0"
blake3 = { version = "1.5", default-features = false, features = ["std"] }
regex = "1.12.2"
lazy_static = "1.4"
nom = "7.1.3"
rustc-hash = "2.1.1"
smol_str = { version = "0.3.1", features = ["serde"] }
rayon = { version = "1.8", optional = true }
smallvec = "1.15.1"
indexmap = { version = "2.13.0", features = ["serde"] }
tracing = "0.1"
ssp-protocol = { path = "../ssp-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.48", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console"] }
