[package]
name = "ssp-ffi"
version = "0.0.1-canary.70"
edition = "2021"
description = "C ABI (Dart FFI) bindings for ssp"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# No mimalloc: its global-allocator per-thread init (mi_thread_init) segfaults
# when this dylib is first loaded in a secondary Dart isolate (observed in the
# multi-suite test runner). The server/CLI keep mimalloc via ssp's default
# features; the client circuit doesn't need it.
ssp = { path = "../ssp", default-features = false, features = ["parallel"] }
libc = "0.2"
